[start]
command:/usr/sbin/daemon -f /usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Speedtest/speedtest.py run
parameters:
type:script
allowed_groups:wheel,wwwonly
message:starting speedtest
description:Run a speed test

[status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Speedtest/speedtest.py status
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:speedtest status
description:Speedtest status

[results]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Speedtest/speedtest.py results
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:speedtest results
description:Speedtest history

[servers]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Speedtest/speedtest.py servers
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:listing speedtest servers
description:Nearby Speedtest servers

[install_cli]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/Speedtest/install_cli.sh
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:installing Ookla speedtest CLI
description:Install or repair the Ookla CLI

[cron_apply]
command:/usr/local/sbin/pluginctl -s cron restart
parameters:
type:script
allowed_groups:wheel,wwwonly
message:applying speedtest schedule
description:Re-render cron jobs

[clear]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Speedtest/speedtest.py clear
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:clearing speedtest history
description:Delete stored results

[summary]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/Speedtest/speedtest.py summary
parameters:
type:script_output
allowed_groups:wheel,wwwonly
message:speedtest summary
description:Latest and 30-day average speeds
